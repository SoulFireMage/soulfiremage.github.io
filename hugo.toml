baseURL = 'https://starship-whisperer.com/'
languageCode = 'en-us'
title = 'Starship Whisperer'
theme = 'PaperMod'

[permalinks]
  posts = '/posts/:contentbasename/'

[params]
  # PaperMod specific settings
  env = "production"
  description = "Starship Whisperer: tools, experiments and writing on AI, maths and stories, by Richard Griffiths"
  author = "Richard Griffiths"
  
  # Home page profile
  # Front page is layouts/home.html; profile mode is off so it isn't used.
  [params.profileMode]
    enabled = false
    title = "Richard Griffiths"
    subtitle = "Software Developer | Writer | Explorer of Ideas"
    imageUrl = "/images/wing-left.png"
    imageWidth = 120
    imageHeight = 120
    
  # Show reading time, word count, etc.
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  
  # Table of contents
  ShowToc = true
  TocOpen = false
  
  
  # Social icons
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/SoulFireMage"

[menu]
  [[menu.main]]
    name = 'Home'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'Posts'
    url = '/posts'
    weight = 2
  [[menu.main]]
    name = 'Stories'
    url = '/stories'
    weight = 3
  [[menu.main]]
    name = 'Links'
    url = '/links'
    weight = 4
  [[menu.main]]
    name = 'Political Analysis Tool'
    url = '/political-analysis-tool'
    weight = 5
  [[menu.main]]
    name = 'Search'
    url = '/search'
    weight = 6

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'monokai'
    lineNos = true
    noClasses = false

# Enable search
[outputs]
  home = ["HTML", "RSS", "JSON"]
