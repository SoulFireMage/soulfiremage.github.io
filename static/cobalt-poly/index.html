<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: hardware panel — CRT scope strip on top, auto-fill rack of modules, sticky keybed at the bottom */
:root{
  --panel:#d8dde4; --panel-2:#c8cfd8; --ink:#1a2130; --muted:#586376; --line:#a9b2be;
  --accent:#2a48c8; --accent-soft:rgba(42,72,200,.14); --led:#ff9a1a; --led-off:#b9a58c;
  --screen:#0c1620; --screen-grid:#1b2a36; --trace:#ffb44a;
  --knob-top:#f4f6f9; --knob-side:#9aa4b2; --track:#b3bcc8;
  --key-w:#f5f7f9; --key-w-down:#cdd8ff; --key-b:#1b1f27; --key-b-down:#3550c8; --key-edge:#8f99a6;
  --f-display:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --panel:#181d26; --panel-2:#212835; --ink:#e2e7ef; --muted:#8a95a7; --line:#323b4a;
  --accent:#7590ff; --accent-soft:rgba(117,144,255,.16); --led:#ffa63a; --led-off:#4a4034;
  --screen:#070d13; --screen-grid:#15222d; --trace:#ffb44a;
  --knob-top:#3a4352; --knob-side:#151a22; --track:#2e3644;
  --key-w:#cfd5de; --key-w-down:#93a6ff; --key-b:#0e1116; --key-b-down:#5a74f0; --key-edge:#0b0e12;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --panel:#181d26; --panel-2:#212835; --ink:#e2e7ef; --muted:#8a95a7; --line:#323b4a;
  --accent:#7590ff; --accent-soft:rgba(117,144,255,.16); --led:#ffa63a; --led-off:#4a4034;
  --screen:#070d13; --screen-grid:#15222d; --trace:#ffb44a;
  --knob-top:#3a4352; --knob-side:#151a22; --track:#2e3644;
  --key-w:#cfd5de; --key-w-down:#93a6ff; --key-b:#0e1116; --key-b-down:#5a74f0; --key-edge:#0b0e12;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--panel);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:1180px;margin:0 auto;padding-block:16px 0;display:flex;flex-direction:column;gap:14px}

/* header */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--f-display);font-size:20px;letter-spacing:.14em;margin:0;font-weight:400;text-wrap:balance}
.brand h1 b{color:var(--accent);font-weight:400}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{font:inherit;color:var(--ink)}
.btn,select{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;height:34px;padding:0 12px;cursor:pointer;font-size:13px}
.btn:hover,select:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,.knob:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.power{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:10px;letter-spacing:.12em}
.led{width:9px;height:9px;border-radius:50%;background:var(--led-off);flex:none;transition:background .08s,box-shadow .08s}
.led.on{background:var(--led);box-shadow:0 0 8px var(--led)}

/* screen */
.screen{background:var(--screen);border-radius:10px;border:1px solid var(--line);overflow:hidden;position:relative;
  box-shadow:inset 0 0 40px rgba(0,0,0,.55)}
.screen canvas{display:block;width:100%;height:150px}
.readout{position:absolute;inset:10px 12px auto auto;display:flex;gap:14px;font-family:var(--f-mono);font-size:11px;color:var(--trace);opacity:.85;pointer-events:none}
.hint{position:absolute;inset:auto 12px 10px 12px;font-family:var(--f-mono);font-size:11px;color:var(--trace);opacity:.6;pointer-events:none}

/* rack */
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.mod{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mod h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:10.5px;letter-spacing:.18em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod h2 span{color:var(--ink)}
.knobs{display:flex;flex-wrap:wrap;gap:10px 6px}
.k{width:58px;display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none;-webkit-user-select:none}
.knob{width:46px;height:46px;touch-action:none;cursor:ns-resize;border-radius:50%}
.knob svg{width:100%;height:100%;display:block;overflow:visible}
.k label{font-family:var(--f-display);font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;white-space:nowrap}
.k output{font-family:var(--f-mono);font-size:10.5px;color:var(--ink);font-variant-numeric:tabular-nums;min-height:15px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:100%}
.seg button{flex:1 1 0;min-width:0;height:30px;border:0;background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0 2px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.seg svg{width:22px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.note{font-size:11.5px;color:var(--muted);margin:0}

/* keybed */
.keys{position:sticky;bottom:0;background:var(--panel);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));z-index:5;
  border-top:1px solid var(--line);margin-top:2px;display:flex;flex-direction:column;gap:8px}
.keyctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.keyctl .btn{height:30px;padding:0 10px}
.keyctl .sp{flex:1}
.kb{position:relative;height:130px;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:0 0 6px 6px;overflow:hidden}
.kw,.kbk{position:absolute;top:0;border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-family:var(--f-mono);font-size:10px}
.kw{height:100%;background:var(--key-w);border:1px solid var(--key-edge);color:#7d8796}
.kbk{height:60%;background:var(--key-b);z-index:2;color:#7d8796;border:1px solid var(--key-edge)}
.kw.down{background:var(--key-w-down)}
.kbk.down{background:var(--key-b-down)}
.kw .c{position:absolute;top:6px;font-size:9px;color:#8a93a0}
@media (hover:none){.kw span.kc,.kbk span.kc{display:none}}
@media (max-width:520px){.kb{height:112px}.screen canvas{height:120px}.brand h1{font-size:17px}}
@media (prefers-reduced-motion:reduce){.led{transition:none}}
</style>

<div class="wrap">
  <header class="bar">
    <div class="brand">
      <h1>COBALT<b>·</b>POLY</h1>
      <small>10-voice subtractive · Web Audio + AudioWorklet</small>
    </div>
    <div class="ctrls">
      <select id="preset" aria-label="Preset"></select>

  <section class="screen" aria-label="Oscilloscope and spectrum">

    </div>
    <div class="kb" id="kb"></div>
  </section>
</div>

<script>
(()=>{
"use strict";
/* ---------- parameter registry ---------- */
const hz=v=>v<1000?v.toFixed(0)+' Hz':(v/1000).toFixed(v<10000?2:1)+'k';
const sec=v=>v<1?(v*1000).toFixed(0)+' ms':v.toFixed(2)+' s';
const pct=v=>Math.round(v*100)+'%';
const sgn=v=>(v>0?'+':'')+v;
const oct=v=>(v>0?'+':'')+v.toFixed(1)+' oct';
const D=[
 {id:'o1oct',m:'osc1',l:'Octave',min:-2,max:2,def:0,step:1,f:sgn},
 {id:'o1uni',m:'osc1',l:'Unison',min:1,max:7,def:1,step:1,f:v=>v+'×'},
 {id:'o1det',m:'osc1',l:'Detune',min:0,max:60,def:14,f:v=>v.toFixed(0)+'¢'},
 {id:'spread',m:'osc1',l:'Width',min:0,max:1,def:.7,f:pct},
 {id:'o2oct',m:'osc2',l:'Octave',min:-2,max:2,def:0,step:1,f:sgn},
 {id:'o2semi',m:'osc2',l:'Semi',min:-12,max:12,def:0,step:1,f:sgn},
 {id:'o2fine',m:'osc2',l:'Fine',min:-50,max:50,def:7,f:v=>sgn(Math.round(v))+'¢'},
 {id:'m1',m:'mix',l:'Osc 1',min:0,max:1,def:.8,f:pct},
 {id:'m2',m:'mix',l:'Osc 2',min:0,max:1,def:.45,f:pct},
 {id:'msub',m:'mix',l:'Sub',min:0,max:1,def:0,f:pct},
 {id:'mnoise',m:'mix',l:'Noise',min:0,max:1,def:0,f:pct},
 {id:'cut',m:'filter',l:'Cutoff',min:30,max:18000,def:1800,exp:1,f:hz},
 {id:'res',m:'filter',l:'Reso',min:0,max:1,def:.25,f:pct},
 {id:'fenv',m:'filter',l:'Env amt',min:-4,max:6,def:2.5,f:oct},
 {id:'ktrk',m:'filter',l:'Key trk',min:0,max:1,def:.5,f:pct},
 {id:'fa',m:'fenv',l:'Attack',min:.001,max:6,def:.005,exp:1,f:sec},
 {id:'fd',m:'fenv',l:'Decay',min:.01,max:8,def:.5,exp:1,f:sec},
 {id:'fs',m:'fenv',l:'Sustain',min:0,max:1,def:.3,f:pct},
 {id:'fr',m:'fenv',l:'Release',min:.01,max:8,def:.4,exp:1,f:sec},
 {id:'aa',m:'aenv',l:'Attack',min:.001,max:6,def:.004,exp:1,f:sec},
 {id:'ad',m:'aenv',l:'Decay',min:.01,max:8,def:.6,exp:1,f:sec},
 {id:'as',m:'aenv',l:'Sustain',min:0,max:1,def:.75,f:pct},
 {id:'ar',m:'aenv',l:'Release',min:.01,max:8,def:.35,exp:1,f:sec},
 {id:'lrate',m:'lfo',l:'Rate',min:.05,max:20,def:3,exp:1,f:v=>v.toFixed(v<1?2:1)+' Hz'},
 {id:'ldepth',m:'lfo',l:'Depth',min:0,max:1,def:0,f:pct},
 {id:'drive',m:'fx',l:'Drive',min:0,max:1,def:.08,f:pct},
 {id:'dtime',m:'fx',l:'Delay',min:.03,max:1.2,def:.375,exp:1,f:sec},
 {id:'dfb',m:'fx',l:'Feedback',min:0,max:.9,def:.35,f:pct},
 {id:'dmix',m:'fx',l:'Dly mix',min:0,max:1,def:.18,f:pct},
 {id:'rsize',m:'fx',l:'Space',min:.3,max:6,def:2.2,exp:1,f:v=>v.toFixed(1)+' s'},
 {id:'rmix',m:'fx',l:'Rev mix',min:0,max:1,def:.25,f:pct},
 {id:'bpm',m:'arp',l:'Tempo',min:60,max:200,def:120,step:1,f:v=>v+' bpm'},
 {id:'agate',m:'arp',l:'Gate',min:.05,max:1,def:.5,f:pct},
 {id:'aoct',m:'arp',l:'Range',min:1,max:3,def:1,step:1,f:v=>v+' oct'},
 {id:'vol',m:'master',l:'Volume',min:0,max:1,def:.7,f:pct},
 {id:'glide',m:'master',l:'Glide',min:0,max:.5,def:0,f:sec},
];
const WAVES=['sine','triangle','sawtooth','square'];
const S=[
 {id:'o1wave',m:'osc1',opts:WAVES,def:'sawtooth',wave:1},
 {id:'o2wave',m:'osc2',opts:WAVES,def:'sawtooth',wave:1},
 {id:'ftype',m:'filter',opts:['lp12','lp24','ladder','hp','bp'],labels:['LP12','LP24','LADDER','HP','BP'],def:'lp24'},
 {id:'lwave',m:'lfo',opts:WAVES,def:'sine',wave:1},
 {id:'ltgt',m:'lfo',opts:['pitch','filter','amp'],labels:['PITCH','FILTER','AMP'],def:'filter'},
 {id:'arp',m:'arp',opts:['off','up','down','updown','random'],labels:['OFF','UP','DOWN','U/D','RND'],def:'off'},
];
const MODS=[
 ['osc1','OSC 1','Shape, supersaw unison and stereo width'],['osc2','OSC 2','Interval and fine detune against Osc 1'],
 ['mix','MIXER',''],['filter','FILTER','LADDER is a 4-pole Moog-style model with tanh saturation, run per voice in an AudioWorklet'],
 ['fenv','FILTER ENV',''],['aenv','AMP ENV',''],['lfo','LFO',''],['fx','DRIVE · DELAY · REVERB',''],
 ['arp','ARPEGGIATOR','16th notes; hold a chord'],['master','MASTER','Glide slides new notes from the last pitch'],
];
const P={};D.forEach(d=>P[d.id]=d.def);S.forEach(s=>P[s.id]=s.def);
const byId={};D.forEach(d=>byId[d.id]=d);
const toN=(d,v)=>d.exp?Math.log(v/d.min)/Math.log(d.max/d.min):(v-d.min)/(d.max-d.min);
const fromN=(d,n)=>{n=Math.min(1,Math.max(0,n));let v=d.exp?d.min*Math.pow(d.max/d.min,n):d.min+n*(d.max-d.min);if(d.step)v=Math.round(v/d.step)*d.step;return v};

/* ---------- presets ---------- */
const PRESETS={
 'Init saw':{},
 'Warm pad':{o1uni:5,o1det:18,spread:.85,o2fine:9,m2:.5,ftype:'lp24',cut:850,res:.15,fenv:1.6,fa:1.4,fd:2.2,fs:.5,fr:2.8,aa:1.1,ad:1,as:.85,ar:3,ltgt:'filter',lrate:.25,ldepth:.22,rmix:.5,rsize:4.2,dmix:.14,drive:.05},
 'Acid line':{o1wave:'sawtooth',o1uni:1,m1:.9,m2:0,msub:.35,ftype:'ladder',cut:260,res:.86,fenv:4.6,ktrk:.3,fa:.001,fd:.22,fs:0,fr:.12,aa:.002,ad:.35,as:.65,ar:.07,drive:.5,dtime:.33,dfb:.4,dmix:.16,rmix:.1,glide:.06,arp:'up',aoct:2,bpm:128,agate:.45},
 'Glass pluck':{o1wave:'triangle',o2wave:'square',o2oct:1,m2:.25,ftype:'lp12',cut:1100,res:.3,fenv:3.6,fa:.001,fd:.35,fs:0,fr:.4,aa:.001,ad:.7,as:0,ar:.5,dtime:.3,dfb:.5,dmix:.32,rmix:.35,rsize:3},
 'Supersaw lead':{o1uni:7,o1det:26,spread:1,o2oct:1,m2:.35,ftype:'lp24',cut:3800,res:.18,fenv:1.2,fd:.8,fs:.6,aa:.01,as:.9,ar:.35,ltgt:'pitch',lrate:5.5,ldepth:.12,dmix:.24,rmix:.3,glide:.04},
 'Wobble bass':{o1uni:3,o1det:10,spread:.4,o2oct:-1,m2:.55,msub:.6,ftype:'ladder',cut:220,res:.62,fenv:.6,fd:.3,fs:.6,aa:.003,as:1,ar:.15,ltgt:'filter',lwave:'sine',lrate:4,ldepth:.75,drive:.6,dmix:.05,rmix:.08},
 'Brass stab':{o1uni:2,o1det:8,o2fine:-9,m2:.7,ftype:'lp12',cut:650,res:.1,fenv:2.6,fa:.07,fd:.55,fs:.4,fr:.3,aa:.04,ad:.4,as:.8,ar:.25,rmix:.28,drive:.15},
};

/* ---------- audio engine ---------- */
let ctx=null, out={}, lfo={}, ladderOK=false, noiseBuf=null;
const voices=[]; let lastFreq=null;
const MAXV=10;
const mtof=n=>440*Math.pow(2,(n-69)/12);
const LADDER=`class L extends AudioWorkletProcessor{
static get parameterDescriptors(){return[{name:'cutoff',defaultValue:1000,minValue:10,maxValue:22000,automationRate:'a-rate'},{name:'detune',defaultValue:0,minValue:-14400,maxValue:14400,automationRate:'a-rate'},{name:'res',defaultValue:0,minValue:0,maxValue:1.2,automationRate:'k-rate'}]}
constructor(){super();this.s=[new Float64Array(4),new Float64Array(4)]}
process(I,O,p){const i=I[0],o=O[0];if(!i||!i.length)return false;
const cu=p.cutoff,de=p.detune,k=p.res[0]*4,sr=sampleRate,N=o[0].length,lim=sr*.45,w=2*Math.PI/sr;
const g=new Float32Array(N);for(let n=0;n<N;n++){let fc=(cu.length>1?cu[n]:cu[0])*Math.pow(2,(de.length>1?de[n]:de[0])/1200);if(fc>lim)fc=lim;if(fc<10)fc=10;g[n]=1-Math.exp(-w*fc)}
for(let c=0;c<o.length;c++){const x=i[Math.min(c,i.length-1)],y=o[c],s=this.s[c]||(this.s[c]=new Float64Array(4));
for(let n=0;n<N;n++){const G=g[n],u=Math.tanh(x[n]*1.4-k*s[3]);s[0]+=G*(u-s[0]);s[1]+=G*(s[0]-s[1]);s[2]+=G*(s[1]-s[2]);s[3]+=G*(s[2]-s[3]);y[n]=s[3]*(1+k*.4)}}
return true}}
registerProcessor('cobalt-ladder',L);`;

async function startAudio(){
  if(ctx){ if(ctx.state!=='running') await ctx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  ctx=new AC({latencyHint:'interactive'});
  // noise
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  // output chain
  out.bus=ctx.createGain();
  out.trem=ctx.createGain();
  out.pre=ctx.createGain();
  out.shaper=ctx.createWaveShaper();out.shaper.oversample='4x';
  out.post=ctx.createGain();
  out.dSend=ctx.createGain();out.delay=ctx.createDelay(2);out.dFilt=ctx.createBiquadFilter();out.dFilt.type='lowpass';out.dFilt.frequency.value=3800;
  out.dFb=ctx.createGain();out.dOut=ctx.createGain();out.dPan=ctx.createStereoPanner();
  out.rSend=ctx.createGain();out.conv=ctx.createConvolver();
  out.master=ctx.createGain();
  out.comp=ctx.createDynamicsCompressor();out.comp.threshold.value=-10;out.comp.ratio.value=8;out.comp.attack.value=.003;out.comp.release.value=.2;
  out.an=ctx.createAnalyser();out.an.fftSize=2048;out.an.smoothingTimeConstant=.75;
  out.bus.connect(out.trem);out.trem.connect(out.pre);out.pre.connect(out.shaper);out.shaper.connect(out.post);
  out.post.connect(out.master);
  out.post.connect(out.dSend);out.dSend.connect(out.delay);out.delay.connect(out.dFilt);out.dFilt.connect(out.dFb);out.dFb.connect(out.delay);
  out.dFilt.connect(out.dPan);out.dPan.connect(out.dOut);out.dOut.connect(out.master);
  out.post.connect(out.rSend);out.rSend.connect(out.conv);out.conv.connect(out.master);
  out.master.connect(out.comp);out.comp.connect(out.an);out.an.connect(ctx.destination);
  // LFO
  lfo.osc=ctx.createOscillator();lfo.pitch=ctx.createGain();lfo.filter=ctx.createGain();lfo.amp=ctx.createGain();
  lfo.osc.connect(lfo.pitch);lfo.osc.connect(lfo.filter);lfo.osc.connect(lfo.amp);lfo.amp.connect(out.trem.gain);
  lfo.osc.start();
  // ladder worklet
  try{
    if(ctx.audioWorklet){
      const url=URL.createObjectURL(new Blob([LADDER],{type:'application/javascript'}));
      await ctx.audioWorklet.addModule(url);ladderOK=true;
    }
  }catch(e){ladderOK=false}
  segRefresh('ftype');

function setPower(on){

function buildImpulse(){

function noteOn(note,t){

  v.g2=ctx.createGain();v.g2.gain.value=P.m2;v.osc2.connect(v.g2);v.g2.connect(mix);lfo.pitch.connect(v.osc2.detune);v.oscs.push(v.osc2);
  // sub
  v.sub=ctx.createOscillator();v.sub.type='square';glideTo(v.sub.frequency,v.f1/2,t);
  v.gs=ctx.createGain();v.gs.gain.value=P.msub*.6;v.sub.connect(v.gs);v.gs.connect(mix);lfo.pitch.connect(v.sub.detune);v.oscs.push(v.sub);

let curF0=0;
function glideTo(param,f,t){

function release(v,t,fast){
  if(v.rel&&!fast)return;

  hold(v.amp.gain,t);v.amp.gain.setTargetAtTime(0,t,r/4);
  hold(v.env.offset,t);v.env.offset.setTargetAtTime(0,t,fr/4);

  try{v.env.stop(stop)}catch(e){}

    v.oscs.forEach(o=>{try{o.disconnect()}catch(e){}});

function liveVoices(){return voices.filter(v=>!v.dead)}
function applyLive(id){
  if(!ctx)return;const now=ctx.currentTime,T=.015;
  const vs=liveVoices();
  switch(id){
    case 'cut':case 'ktrk':vs.forEach(v=>v.fFreq.forEach(p=>{hold(p,now);p.setTargetAtTime(baseCut(v.note),now,T)}));break;
    case 'res':vs.forEach(v=>{if(v.lad)v.lad.parameters.get('res').setTargetAtTime(P.res*1.04,now,T);
      if(v.bq)v.bq.forEach(b=>b.Q.setTargetAtTime(v.ftype==='bp'?1+P.res*12:resQ(P.res,v.ftype),now,T))});break;
    case 'm1':vs.forEach(v=>v.g1.gain.setTargetAtTime(P.m1/Math.sqrt(v.o1.length),now,T));break;
    case 'm2':vs.forEach(v=>v.g2.gain.setTargetAtTime(P.m2,now,T));break;
    case 'msub':vs.forEach(v=>v.gs.gain.setTargetAtTime(P.msub*.6,now,T));break;
    case 'mnoise':vs.forEach(v=>v.gn.gain.setTargetAtTime(P.mnoise*.5,now,T));break;
    case 'o1det':case 'spread':vs.forEach(v=>v.o1.forEach(x=>{x.o.detune.setTargetAtTime(x.pos*P.o1det,now,T);x.pn.pan.setTargetAtTime(x.pos*P.spread,now,T)}));break;
    case 'o1oct':vs.forEach(v=>{const f=mtof(v.note)*Math.pow(2,P.o1oct);v.o1.forEach(x=>x.o.frequency.setTargetAtTime(f,now,T));v.sub.frequency.setTargetAtTime(f/2,now,T)});break;
    case 'o2oct':case 'o2semi':vs.forEach(v=>v.osc2.frequency.setTargetAtTime(mtof(v.note)*Math.pow(2,P.o2oct+P.o2semi/12),now,T));break;
    case 'o2fine':vs.forEach(v=>v.osc2.detune.setTargetAtTime(P.o2fine,now,T));break;
    case 'o1wave':vs.forEach(v=>v.o1.forEach(x=>x.o.type=P.o1wave));break;
    case 'o2wave':vs.forEach(v=>v.osc2.type=P.o2wave);break;
    case 'lrate':lfo.osc.frequency.setTargetAtTime(P.lrate,now,.02);break;
    case 'lwave':lfo.osc.type=P.lwave;break;
    case 'ldepth':case 'ltgt':{const d=P.ldepth;
      lfo.pitch.gain.setTargetAtTime(P.ltgt==='pitch'?d*80:0,now,T);
      lfo.filter.gain.setTargetAtTime(P.ltgt==='filter'?d*3000:0,now,T);
      lfo.amp.gain.setTargetAtTime(P.ltgt==='amp'?d*.5:0,now,T);

    case 'drive':out.shaper.curve=driveCurve(P.drive);out.pre.gain.setTargetAtTime(1+P.drive*1.5,now,T);out.post.gain.setTargetAtTime(1/(1+P.drive*1.8),now,T);break;
    case 'dtime':out.delay.delayTime.setTargetAtTime(P.dtime,now,.05);break;
    case 'dfb':out.dFb.gain.setTargetAtTime(P.dfb,now,T);break;
    case 'dmix':out.dSend.gain.setTargetAtTime(1,now,T);out.dOut.gain.setTargetAtTime(P.dmix,now,T);break;
    case 'rmix':out.rSend.gain.setTargetAtTime(P.rmix*1.2,now,T);break;
    case 'rsize':clearTimeout(impT);impT=setTimeout(buildImpulse,180);break;
    case 'vol':out.master.gain.setTargetAtTime(P.vol*P.vol*1.4,now,.02);break;

/* ---------- note routing + arpeggiator ---------- */
const held=new Map(); // note -> voice (direct play)
let arpNotes=[],arpOrder=[],arpTimer=null,arpNext=0,arpIdx=0,arpDir=1,latch=false,physDown=new Set();
function press(note){
  physDown.add(note);
  startAudio().then(()=>{
    if(P.arp!=='off'&&!arpTimer)arpSet();
    if(P.arp!=='off'){
      if(latch&&physDown.size===1)arpOrder=[];
      if(!arpOrder.includes(note))arpOrder.push(note);
      arpNotes=[...arpOrder];
    }else{
      if(held.has(note))release(held.get(note),0);
      held.set(note,noteOn(note,0));
    }
    readNote(note);
  });

}
function lift(note){
  physDown.delete(note);keyVis(note,false);
  if(!ctx)return;
  if(P.arp!=='off'){
    if(!latch){arpOrder=arpOrder.filter(n=>n!==note);arpNotes=[...arpOrder]}
  }else if(held.has(note)){release(held.get(note),0);held.delete(note)}
}
function arpSeq(){
  const base=[...arpNotes].sort((a,b)=>a-b);if(!base.length)return[];
  const s=[];for(let o=0;o<P.aoct;o++)base.forEach(n=>s.push(n+12*o));return s;
}
function arpSet(){
  if(P.arp==='off'){clearInterval(arpTimer);arpTimer=null;arpOrder=[];arpNotes=[];return}
  held.forEach(v=>release(v,0));held.clear();
  arpOrder=[...physDown];arpNotes=[...arpOrder];
  if(!arpTimer&&ctx){arpNext=ctx.currentTime+.05;arpTimer=setInterval(arpTick,25)}
}
function arpTick(){
  if(!ctx)return;
  const step=60/P.bpm/4;
  if(arpNext<ctx.currentTime-.2)arpNext=ctx.currentTime+.02;
  while(arpNext<ctx.currentTime+.1){
    const s=arpSeq();
    if(s.length){
      let n;
      if(P.arp==='up')n=s[arpIdx++%s.length];
      else if(P.arp==='down')n=s[s.length-1-(arpIdx++%s.length)];
      else if(P.arp==='random')n=s[Math.floor(Math.random()*s.length)];
      else{ // up/down without repeating ends
        const L=s.length;const cyc=L>1?2*L-2:1;const k=arpIdx++%cyc;n=s[k<L?k:cyc-k];
      }
      const v=noteOn(n,arpNext);release(v,arpNext+step*P.agate);
      const d=(arpNext-ctx.currentTime)*1000;setTimeout(()=>{flash();readNote(n)},Math.max(0,d));
    }else arpIdx=0;
    arpNext+=step;
  }
}
const arpLed=document.getElementById('arpLed');

function arcPath(a0,a1,r){const c=23,p=a=>[c+r*Math.cos(a),c+r*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`}

    e.style.left=((wi+1)*W-W*.31)+'%';e.style.width=(W*.62)+'%';const kc=KC[n-base];if(kc)e.innerHTML=`<span class="kc">${kc.toUpperCase()}</span>`;kb.appendChild(e)}
  document.getElementById('octLbl').textContent=nname(base);
  physDown.forEach(n=>keyVis(n,true));
}
function keyVis(n,on){const e=kb.querySelector(`[data-n="${n}"]`);if(e)e.classList.toggle('down',on)}
const ptr=new Map();
const noteAt=(x,y)=>{const el=document.elementFromPoint(x,y);const k=el&&el.closest&&el.closest('.kw,.kbk');return k&&kb.contains(k)?+k.dataset.n:null};
kb.addEventListener('pointerdown',e=>{e.preventDefault();kb.setPointerCapture(e.pointerId);const n=noteAt(e.clientX,e.clientY);ptr.set(e.pointerId,n);if(n!=null)press(n)});
kb.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const n=noteAt(e.clientX,e.clientY),p=ptr.get(e.pointerId);
  if(n!==p){if(p!=null)lift(p);if(n!=null)press(n);ptr.set(e.pointerId,n)}});
const pend=e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);if(p!=null)lift(p);ptr.delete(e.pointerId)};
kb.addEventListener('pointerup',pend);kb.addEventListener('pointercancel',pend);
const shift=d=>{const nb=Math.min(84,Math.max(24,base+d));if(nb===base)return;panic();base=nb;buildKeys()};
document.getElementById('octDn').addEventListener('click',()=>shift(-12));
document.getElementById('octUp').addEventListener('click',()=>shift(12));
const qwerty=new Map();
window.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;const t=e.target;if(t&&(t.tagName==='SELECT'||t.tagName==='INPUT'))return;
  const k=e.key.toLowerCase();if(k==='z'){shift(-12);return}if(k==='x'){shift(12);return}
  const i=KC.indexOf(k);if(i<0)return;e.preventDefault();const n=base+i;qwerty.set(k,n);press(n)});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(qwerty.has(k)){lift(qwerty.get(k));qwerty.delete(k)}});
window.addEventListener('blur',()=>{qwerty.forEach(n=>lift(n));qwerty.clear()});

/* ---------- scope ---------- */
const cv=document.getElementById('scope'),cx=cv.getContext('2d');
let td=null,fd=null,col={},frame=0;
function readCols(){const cs=getComputedStyle(document.documentElement);col={bg:cs.getPropertyValue('--screen').trim(),grid:cs.getPropertyValue('--screen-grid').trim(),tr:cs.getPropertyValue('--trace').trim()}}
function draw(){
  requestAnimationFrame(draw);
  if(frame++%90===0)readCols();
  const dpr=Math.min(2,window.devicePixelRatio||1),W=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.fillStyle=col.bg;cx.fillRect(0,0,W,H);
  cx.strokeStyle=col.grid;cx.lineWidth=1;cx.beginPath();
  for(let x=0;x<=W;x+=W/12){cx.moveTo(Math.round(x)+.5,0);cx.lineTo(Math.round(x)+.5,H)}
  for(let y=0;y<=H;y+=H/6){cx.moveTo(0,Math.round(y)+.5);cx.lineTo(W,Math.round(y)+.5)}cx.stroke();
  const sw=Math.min(W*.62,W-160);// scope region left, spectrum right
  if(ctx&&out.an){
    if(!td){td=new Float32Array(out.an.fftSize);fd=new Uint8Array(out.an.frequencyBinCount)}
    out.an.getFloatTimeDomainData(td);out.an.getByteFrequencyData(fd);
    let s=0;for(let i=1;i<td.length/2;i++){if(td[i-1]<0&&td[i]>=0){s=i;break}}
    const N=Math.min(900,td.length-s);
    cx.strokeStyle=col.tr;cx.lineWidth=1.6;cx.shadowColor=col.tr;cx.shadowBlur=6;cx.beginPath();
    for(let i=0;i<N;i++){const x=i/(N-1)*sw,y=H/2-td[s+i]*H*.9;i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();cx.shadowBlur=0;
    // spectrum, log-spaced bars
    const bars=Math.max(12,Math.floor((W-sw-20)/6)),x0=sw+14,bw=(W-x0-8)/bars,ny=ctx.sampleRate/2;
    cx.fillStyle=col.tr;cx.globalAlpha=.75;
    for(let b=0;b<bars;b++){const f=40*Math.pow(16000/40,b/bars),f2=40*Math.pow(16000/40,(b+1)/bars);
      let i0=Math.floor(f/ny*fd.length),i1=Math.max(i0+1,Math.floor(f2/ny*fd.length)),m=0;for(let i=i0;i<i1&&i<fd.length;i++)m=Math.max(m,fd[i]);
      const h=m/255*(H-24);cx.fillRect(x0+b*bw,H-8-h,Math.max(1,bw-2),h)}
    cx.globalAlpha=1;
    document.getElementById('rVoices').textContent=liveVoices().filter(v=>!v.rel).length+' v';
  }else{cx.strokeStyle=col.tr;cx.globalAlpha=.5;cx.beginPath();cx.moveTo(0,H/2);cx.lineTo(sw,H/2);cx.stroke();cx.globalAlpha=1}
  cx.strokeStyle=col.grid;cx.beginPath();cx.moveTo(sw+6.5,8);cx.lineTo(sw+6.5,H-8);cx.stroke();
}

['pointerup','touchend','keydown','click'].forEach(ev=>window.addEventListener(ev,()=>{if(ctx&&ctx.state==='suspended'&&document.getElementById('pled').classList.contains('on'))ctx.resume()},true));
/* ---------- boot ---------- */
let saved=null;try{saved=JSON.parse(localStorage.getItem('cobalt-poly-patch')||'null')}catch(e){}
buildKeys();
applyPatch(saved&&typeof saved==='object'?saved:PRESETS['Init saw']);
if(saved)sel.value='';
readCols();draw();
})();
</script>
